# Grafana datasource provisioning (Fase 14).
# Prometheus scrapes every service's /metrics; Loki receives container logs
# via promtail (see infra/docker/promtail-config.yml and README-observability.md).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
