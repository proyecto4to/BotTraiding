# Fase 15: CPU-based autoscaling for the stateless services (min 1, max 5,
# target 70% of the 100m CPU request). Excluded on purpose:
# - scheduler: single-instance APScheduler cron; replicas would double-fire jobs.
# - auth-service: stateless in principle but autoscaling deferred until token
#   revocation under concurrent replicas is verified (see auth-service.yaml).
# Caveats for two of the scaled services (documented in docs/SCALABILITY.md):
# - gateway: the token-bucket rate limiter is in-memory, so the effective
#   limit becomes per-replica until it moves to Redis.
# - broker-connectors: connector registry + credential store are in-memory
#   per replica; connect/cancel must land on the replica holding the broker
#   session (needs Redis-backed store or sticky routing before heavy scaling).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: tradingplatform
  labels:
    app: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
