# Fase 15: resource requests/limits set, but NO HorizontalPodAutoscaler on
# purpose: the scheduler runs in-process APScheduler cron jobs, so a second
# replica would fire every job twice. Scaling it needs a distributed lock or
# a leader election first (see docs/SCALABILITY.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: tradingplatform
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: tradingplatform/scheduler:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: tradingplatform-env
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: tradingplatform
  labels:
    app: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - port: 8000
      targetPort: 8000
