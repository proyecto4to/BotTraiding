# Fase 1: base manifest only, no autoscaling/production tuning
# (docs/ARCHITECTURE.md section 11).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  namespace: tradingplatform
  labels:
    app: trading-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-engine
  template:
    metadata:
      labels:
        app: trading-engine
    spec:
      containers:
        - name: trading-engine
          image: tradingplatform/trading-engine:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: tradingplatform-env
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trading-engine
  namespace: tradingplatform
  labels:
    app: trading-engine
spec:
  selector:
    app: trading-engine
  ports:
    - port: 8000
      targetPort: 8000
