# Base non-secret env shared by every service. Inter-service URLs are not
# needed here: the in-code defaults (http://<service>:8000) match the k8s
# Service names. JWT_SECRET must come from a Secret in a production overlay
# (never a ConfigMap) - see docs/SCALABILITY.md section 4.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tradingplatform-env
  namespace: tradingplatform
data:
  DATABASE_URL: "postgresql://trading:trading@postgres:5432/tradingplatform"
  REDIS_URL: "redis://redis:6379/0"
  NATS_URL: "nats://nats:4222"
