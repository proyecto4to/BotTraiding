# Fase 15: resource requests/limits set, but NO HorizontalPodAutoscaler yet.
# auth-service looks stateless (users/refresh tokens/audit live in Postgres,
# OAuth state is client-side), but token minting/revocation under concurrent
# replicas has not been load-tested, so autoscaling is deferred rather than
# assumed safe (see docs/SCALABILITY.md). Bumping replicas manually is fine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tradingplatform
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: tradingplatform/auth-service:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: tradingplatform-env
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: tradingplatform
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
