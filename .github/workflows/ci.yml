name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - strategy-engine
          - risk-engine
          - portfolio-engine
          - ai-engine
          - execution-engine
          - broker-connectors
          - backtester
          - optimizer
          - paper-trading
          - notification-service
          - scheduler
          - trading-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: pytest -q

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/integration/requirements-integration.txt

      - name: Run integration tests
        run: pytest tests/integration -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check services

  docker-build:
    name: docker-build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - strategy-engine
          - risk-engine
          - portfolio-engine
          - ai-engine
          - execution-engine
          - broker-connectors
          - backtester
          - optimizer
          - paper-trading
          - notification-service
          - scheduler
          - trading-engine
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t tradingplatform/${{ matrix.service }}:ci .
